<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grivat AI - مساعدك الذكي</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>Grivat AI</h1>
            <p>مساعدك الذكي بالدارجة المغربية</p>
        </header>
        <div id="chat-messages" class="chat-messages">
            <div class="message bot-message">
                مرحباً بيك أسي يونس! أنا مساعدك الذكي Grivat AI، كيف يمكن لي نعاونك اليوم؟
            </div>
        </div>
        <form id="chat-form" class="chat-form">
            <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." required>
            <button type="submit">إرسال</button>
        </form>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
